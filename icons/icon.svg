<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo Arredondado -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Moldura do Leitor (Cantos) -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 392 332 L 392 372 A 20 20 0 0 1 372 392 L 332 392" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 180 392 L 140 392 A 20 20 0 0 1 120 372 L 120 332" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Barras do Código -->
  <g fill="#f8fafc">
    <rect x="160" y="170" width="14" height="172" rx="4"/>
    <rect x="188" y="170" width="8" height="172" rx="4"/>
    <rect x="210" y="170" width="22" height="172" rx="5"/>
    <rect x="246" y="170" width="10" height="172" rx="4"/>
    <rect x="270" y="170" width="18" height="172" rx="5"/>
    <rect x="302" y="170" width="8" height="172" rx="4"/>
    <rect x="324" y="170" width="28" height="172" rx="5"/>
  </g>
  
  <!-- Laser Vermelho Central -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="url(#laserGrad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="5" fill="#f87171"/>
</svg>
